# Plumbline CI: a stranger's run. No corpus, no secrets, an empty HOME.
#
# tests/run_all.py runs every suite. With no E-DI corpus (EDI_CORPUS unset, as here) the five corpus-dependent
# checks print SKIP[corpus] <id> by name and the run still passes on everything a stranger can check; the
# vendored corpus copy (schemas/vendor/e-di@<pin>/) carries the schema battery. The last line is the tally:
#   PLUMBLINE-TALLY pass=7 fail=0 skip=5 skipped=corpus.audit-equality,...
# EDI_CORPUS, PLUMBLINE_REQUIRE_CORPUS and CUSTODY_DIR are deliberately not set for that step.
#
# Then the custody corpus is checked out at its pinned commit, and two steps set CUSTODY_DIR to that checkout: one
# checks the vendored custody schema against it, and one runs the real-checker test
# (tests/fixtures/custody/verify/real/ through custody's real checker/check.py). They are the only steps that set it.
name: ci

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the one dependency
        run: python -m pip install jsonschema==4.26.0

      - name: Make an empty HOME (no ~/.hermes, no user config)
        run: mkdir -p "${{ runner.temp }}/home"

      - name: Run every suite (no corpus; corpus checks SKIP by name)
        env:
          HOME: ${{ runner.temp }}/home
        run: python tests/run_all.py

      - name: Check out the custody corpus at its pinned commit
        uses: actions/checkout@v7
        with:
          repository: evaluatordriven/custody
          ref: 3e3ca58de5631bdc58291564303a2e9d25a8653e
          path: custody-upstream

      - name: Compare the vendored custody schema with upstream
        env:
          HOME: ${{ runner.temp }}/home
          CUSTODY_DIR: ${{ github.workspace }}/custody-upstream
        run: python tools/build_schemas.py --custody --check

      - name: Run the real-checker test against upstream custody
        env:
          HOME: ${{ runner.temp }}/home
          CUSTODY_DIR: ${{ github.workspace }}/custody-upstream
        run: python -m unittest -v tests.test_plumbline_verify.VerifierKindTests.test_clean_against_real_checker
